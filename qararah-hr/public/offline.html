<!doctype html>
<html lang="ar-LY" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101a32" />
    <title>لا يوجد اتصال - موارد قرارة</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f1f5f9;color:#14243b;font-family:Tahoma,Arial,sans-serif}.card{width:min(100%,420px);padding:32px 24px;border:1px solid #dce5ef;border-radius:20px;background:#fff;text-align:center;box-shadow:0 18px 48px #172b4412}.mark{width:88px;height:88px;object-fit:cover;border-radius:50%}h1{margin:20px 0 8px;font-size:22px}p{margin:0;color:#61748a;line-height:1.9}button{margin-top:22px;padding:12px 22px;border:0;border-radius:10px;background:#2563eb;color:white;font:inherit;font-weight:700}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/qararah-pwa-192.png" alt="شعار قرارة" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>بيانات نظام الموارد البشرية تحتاج إلى اتصال. أعد الاتصال ثم حاول فتح الصفحة من جديد.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
